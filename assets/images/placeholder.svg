<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17171d"/>
      <stop offset="50%" stop-color="#121216"/>
      <stop offset="100%" stop-color="#0a0a0d"/>
    </linearGradient>
    <radialGradient id="gold-glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="rgba(226, 177, 137, 0.15)"/>
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)"/>
    </radialGradient>
    <linearGradient id="gold-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3d5ba"/>
      <stop offset="50%" stop-color="#e2b189"/>
      <stop offset="100%" stop-color="#9e6d4a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)"/>
  <rect width="100%" height="100%" fill="url(#gold-glow)"/>

  <!-- Border Accent -->
  <rect x="20" y="20" width="760" height="560" rx="24" fill="none" stroke="url(#gold-border)" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="8 6"/>

  <!-- Camera / Atelier Icon -->
  <g transform="translate(400, 260) scale(1.6)" text-anchor="middle">
    <!-- Camera Body -->
    <path d="M-30,-10 L-20,-24 L20,-24 L30,-10 L45,-10 C50,-10 54,-6 54,-1 L54,35 C54,40 50,44 45,44 L-45,44 C-50,44 -54,40 -54,35 L-54,-1 C-54,-6 -50,-10 -45,-10 Z" fill="#1f1f27" stroke="url(#gold-border)" stroke-width="2"/>
    <!-- Lens -->
    <circle cx="0" cy="17" r="18" fill="#121216" stroke="url(#gold-border)" stroke-width="2"/>
    <circle cx="0" cy="17" r="10" fill="none" stroke="#e2b189" stroke-width="1.2" stroke-opacity="0.5"/>
    <circle cx="6" cy="12" r="3" fill="#f3d5ba" opacity="0.6"/>
    <!-- Flash dot -->
    <circle cx="36" cy="3" r="3.5" fill="#e2b189"/>
  </g>

  <!-- Title & Atelier Typography -->
  <text x="400" y="385" font-family="'Cormorant Garamond', 'Playfair Display', serif" font-size="28" fill="#f3d5ba" text-anchor="middle" letter-spacing="4">ANKI MAKEOVERS</text>
  <text x="400" y="415" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#a1a1aa" text-anchor="middle" letter-spacing="3" text-transform="uppercase">Photo Angle Coming Soon</text>
  <text x="400" y="445" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#71717a" text-anchor="middle">Drop image file into assets/images/ to display</text>
</svg>
